# 라이브러리 보안·버전 업데이트를 Dependabot 이 PR 로 올립니다.
# PR 대상은 develop 이며, merge 는 저장소 관리자가 직접 합니다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

    ignore:
      # 빌드 툴체인
      - dependency-name: 'vite'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'vite-plugin-*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@vitejs/plugin-react'
        update-types:
          - 'version-update:semver-major'
      # 타입스크립트·린트
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@eslint/js'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint-plugin-*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript-eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@typescript-eslint/*'
        update-types:
          - 'version-update:semver-major'
      # React 코어
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react-dom'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/react-dom'
        update-types:
          - 'version-update:semver-major'
      # 프리렌더
      - dependency-name: 'puppeteer'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@sparticuz/chromium'
        update-types:
          - 'version-update:semver-major'
