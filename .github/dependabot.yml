# 라이브러리 보안·버전 업데이트를 Dependabot 이 PR 로 올립니다.
# PR 대상은 develop 이며, merge 는 저장소 관리자가 직접 합니다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
